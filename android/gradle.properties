# Project-wide Gradle settings

# Use AndroidX
android.useAndroidX=true
android.enableJetifier=true

# JVM args for Gradle daemon
# -Xss4m: bigger thread stack, fixes StackOverflowError with in-process Kotlin compilation
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Xss4m -Dkotlin.daemon.jvm.options=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

# Specify JDK 11 explicitly (adjust path to your installed JDK 11)
#org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-11.0.30.7-hotspot

# Enable Gradle parallel builds (optional, safe for most RN projects)
org.gradle.parallel=true

# Configure Kotlin JVM target globally (works with Kotlin 1.6)
kotlin.code.style=official

newArchEnabled=false
hermesEnabled=true

# Make dependency downloads resilient to flaky networks (CI): longer timeouts + retries
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=2000